<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2144" />
    <title>Glimmerwick</title>
    <!-- Inline favicon: avoids a 404 (= a console error) on every load. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ffc94d'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23fff7e8'/%3E%3C/svg%3E" />
    <style>
      :root {
        --ui-cream: #fff7e8;
        --ui-ink: #4a3b52;
        --ui-coral: #ff7a6b;
        --ui-mint: #5fd3b0;
        --ui-sun: #ffc94d;
        --ui-sky: #6ab8ff;
        --bg: #2a2144;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ui-cream);
        font-family: 'Nunito Variable', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 40%, #3a2d5c 0%, #1d1633 100%);
      }
      #stage canvas { display: block; outline: none; }
      /* DOM UI layer (owned by the ui module); the engine only reserves it. */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #ui > * { pointer-events: auto; }
      /* Boot screen: shown until __game.ready. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        background: radial-gradient(ellipse at 50% 40%, #4a3b7a 0%, #231a3d 100%);
        transition: opacity 0.45s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot h1 {
        margin: 0;
        font-family: 'Fredoka Variable', system-ui, sans-serif;
        font-weight: 600;
        font-size: clamp(34px, 7vw, 72px);
        letter-spacing: 0.02em;
        color: var(--ui-sun);
        text-shadow: 0 4px 0 #b9783f, 0 10px 24px rgba(0, 0, 0, 0.35);
      }
      #boot p {
        margin: 0;
        font-weight: 700;
        font-size: 16px;
        opacity: 0.85;
        min-height: 1.4em;
      }
      #boot .bar {
        width: min(280px, 60vw);
        height: 10px;
        margin: 0 auto;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      #boot .bar > i {
        display: block;
        height: 100%;
        width: 8%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--ui-mint), var(--ui-sun));
        transition: width 0.25s ease;
      }
      /* Fatal error panel: engine failures are loud, never silent. */
      #fatal {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        place-content: center;
        padding: 24px;
        background: rgba(30, 10, 30, 0.92);
        color: #ffd9d4;
        font: 14px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap;
        user-select: text;
      }
      #fatal.on { display: grid; }
      #fatal h2 { margin: 0 0 8px; color: #ff7a6b; font: 700 20px 'Nunito Variable', sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <div id="boot">
      <h1>Glimmerwick</h1>
      <div class="bar"><i id="boot-bar"></i></div>
      <p id="boot-msg">Waking up the Glimmers…</p>
    </div>
    <div id="fatal"><h2>Something went wrong</h2><div id="fatal-msg"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
